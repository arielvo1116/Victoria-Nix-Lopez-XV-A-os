<title>Victoria Nix Lopez - XV Años</title>
<style>
  :root{
    --olive-dark:#3f4a30;
    --olive:#5b7451;
    --olive-light:#7c8a5a;
    --gold:#c9a860;
    --green-soft:#6fae6a;
    --cream:#f8f6ef;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--cream); }
  body{ display:flex; justify-content:center; font-family:'Georgia','Times New Roman',serif; }

  /* Contenedor tipo "celular": crece con la ventana hasta un tope, en vez de quedar fijo y chico */
  .stage{
    width:min(94vw, 720px);   /* <- sube el 720px si lo quieres aún más grande en monitores */
    position:relative;
    background:var(--cream);
  }

  .view{ position:relative; width:100%; }
  .view img{ display:block; width:100%; height:auto; }

  #view2{ display:none; }
  #view2.visible{ display:block; }

  /* ---------- ZONA DE CLICK SOBRE EL SOBRE ---------- */
  /* Estos % ya están medidos sobre tu imagen real (1.png). Si algún día
     cambias esa imagen por otra con el sobre en otro lugar, reajusta aquí. */
  #clickZone{
    position:absolute;
    left:16.5%;
    top:35.3%;
    width:68%;
    height:29.7%;
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
    /* quita el comentario de abajo mientras ajustas la posición, para ver el área */
    /* outline: 2px dashed red; */
  }

  /* ---------- NOMBRE DEL INVITADO (personalizado por link) ---------- */
  /* Cae justo en el espacio en blanco entre "PARA:" y "ADULTOS/NIÑOS". */
  #guestNameWrap{
    position:absolute;
    left:8%;
    top:85.3%;
    width:84%;
    text-align:center;
  }
  #guestNameWrap span{
    font-size:clamp(16px, 4.6vw, 26px);
    color:var(--olive-dark);
    letter-spacing:0.5px;
  }

  /* ---------- ADULTOS / NIÑOS (personalizado por link) ---------- */
  /* Repintan la cajita con el mismo color que ya tienes en 1.png, para
     que el número real tape al que quedó fijo en la imagen. */
  #adultosBox, #ninosBox{
    position:absolute;
    top:90.5%;
    height:2.1%;
    background:rgb(193,206,195);
    border-radius:1.6vw;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Georgia','Times New Roman',serif;
    font-size:clamp(13px, 3.4vw, 19px);
    color:#2c2c22;
  }
  #adultosBox{ left:35.9%; width:10.9%; }
  #ninosBox{ left:53.9%; width:10.4%; }

  /* ---------- CUENTA REGRESIVA (superpuesta sobre imagen2) ---------- */
  /* También en % sobre la imagen — muévela con top/left si tu diseño cambia. */
  #countdown-wrap{
    position:absolute;
    left:8%;
    top:83.6%;
    width:84%;
    text-align:center;
  }
  #countdown-wrap .cd-title{
    font-style:italic;
    color:var(--olive);
    font-size:clamp(16px, 3.6vw, 22px);
    font-weight:200;
    margin-bottom:14px;
  }
  /* Cada número va en columna junto con SU propia etiqueta,
     así quedan siempre alineados sin importar el ancho de cada número. */
  #countdown-wrap .cd-numbers{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:6px;
  }
  #countdown-wrap .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:0;
  }
  #countdown-wrap .num{
    font-size:clamp(32px, 8.2vw, 58px);
    font-family:Arial, Helvetica, sans-serif;
    font-weight:300;
    line-height:1;
    color:var(--olive-dark);
  }
  #countdown-wrap .num.seconds{
    color:var(--green-soft);
  }
  #countdown-wrap .sep{
    font-size:clamp(20px, 6vw, 34px);
    color:var(--olive-light);
    line-height:1.15; /* para que el ":" quede a la altura óptica de los números */
  }
  #countdown-wrap .lbl{
    margin-top:6px;
    font-size:clamp(9px, 2.3vw, 12px);
    letter-spacing:1px;
    text-transform:uppercase;
    white-space:nowrap;
    color:var(--olive);
  }
  #countdown-wrap .lbl-gold{ color:var(--gold); }
  #countdown-wrap .lbl-green{ color:var(--green-soft); }

  /* ---------- LUCIÉRNAGAS (sobre + escena del castillo) ---------- */
  /* Cada una es un SVG con forma de insecto (cuerpo + alas + antenas) más un halo de luz.
     El halo titila (brillo/tamaño); el cuerpo se ve siempre y solo flota un poco. */
  .firefly-pos{
    position:absolute;
    transform:translate(-50%, -50%);
    pointer-events:none;
  }
  .firefly{
    width:22px;
    height:22px;
    overflow:visible;
    animation-name:firefly-float;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .firefly .glow{
    transform-origin:50% 50%;
    mix-blend-mode:screen;
    animation-name:firefly-twinkle;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  @keyframes firefly-float{
    0%, 100% { transform:translate(0,0); }
    25%      { transform:translate(3px,-4px); }
    50%      { transform:translate(-2px,-7px); }
    75%      { transform:translate(-4px,-2px); }
  }
  @keyframes firefly-twinkle{
    0%, 100% { opacity:0.45; transform:scale(0.8); }
    50%      { opacity:1;    transform:scale(1.3); }
  }

  /* ---------- BOTÓN DE MÚSICA ---------- */
  #musicToggle{
    position:absolute;
    bottom:16px;
    right:16px;
    border:1px solid var(--olive);
    background:rgba(248,246,239,0.9);
    color:var(--olive-dark);
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;
    cursor:pointer;
  }

  /* ---------- BOTÓN CONFIRMAR ASISTENCIA ---------- */

  #confirmBtn{

    width:32.5%;
    height:1.1%;
    cursor:pointer;

  /* ---------- BOTÓN VER UBICACIÓN ---------- */

    left:31.6%;
    top:44.5%;
    width:37.9%;
    height:1.1%;
    display:block;
    /* outline: 2px dashed red; */

</style>

      if (diff <= 0){ clearInterval(cdInterval); return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
